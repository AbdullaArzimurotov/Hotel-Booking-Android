name: Сборка и тесты на Windows

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    steps:
      # Версии сторонних действий закреплены полными SHA.
      - name: Получить исходный код
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Установить JDK 25
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5
        with:
          distribution: temurin
          java-version: '25'
      - name: Подготовить Android SDK
        uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407 # v3
        with:
          # Старый пакет tools удалён из SDK; нужен только актуальный platform-tools.
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - name: Установить платформу API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Проверить переносимость скриптов
        run: python -m unittest discover -s scripts -p "test_*.py" -v
      - name: Собрать APK и выполнить модульные тесты Android
        working-directory: android
        run: .\gradlew.bat --no-daemon :app:assembleDebug :app:testDebugUnitTest :app:lintDebug
      - name: Собрать сервер и выполнить API-тесты
        working-directory: server
        run: .\gradlew.bat --no-daemon test installDist
      # Проверка сборки не заменяет UI-тесты на эмуляторе и smoke с настоящей базой.
